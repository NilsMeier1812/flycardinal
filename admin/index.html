<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroClub - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        body { background-color: #f3f4f6; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen">

    <!-- LOGIN BEREICH -->
    <div id="login-section" class="flex items-center justify-center h-screen px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Admin Login</h3>
            <input type="email" id="email" placeholder="E-Mail" class="w-full mb-4 p-3 border rounded-lg outline-none focus:border-blue-500" required>
            <input type="password" id="password" placeholder="Passwort" class="w-full mb-4 p-3 border rounded-lg outline-none focus:border-blue-500" required>
            <button id="loginBtn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-lg transition-colors">Einloggen</button>
            
            <div class="my-4 border-t border-gray-200 relative"><span class="absolute top-[-10px] left-1/2 transform -translate-x-1/2 bg-white px-2 text-gray-400 text-sm">oder</span></div>
            
            <button id="googleLoginBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center gap-2">
                Mit Google anmelden
            </button>
            <div id="login-error" class="text-red-500 mt-4 text-sm font-semibold"></div>
        </div>
    </div>

    <!-- ADMIN BEREICH -->
    <div id="admin-section" class="hidden max-w-5xl mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-800">AeroClub Admin Dashboard</h1>
            <div class="flex gap-4">
                <a href="/" class="text-blue-600 hover:underline font-medium">Zur Startseite</a>
                <button id="logoutBtn" class="text-red-600 hover:underline font-medium">Abmelden</button>
            </div>
        </div>

        <!-- Slideshow Manager -->
        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100 mb-8">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Slideshow Bilder (Startseite)</h2>
            
            <!-- Upload Bereich -->
            <div class="bg-gray-50 p-6 rounded-xl border-2 border-dashed border-gray-300 mb-6 text-center">
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
                <label for="imageUpload" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow inline-block mb-3 transition-colors">
                    Bild auswählen
                </label>
                <p id="fileName" class="text-sm text-gray-500 mb-4">Kein Bild ausgewählt</p>
                <button id="uploadBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg shadow disabled:opacity-50 transition-colors" disabled>
                    Hochladen zu Cloudinary
                </button>
                <div id="uploadStatus" class="mt-3 font-semibold text-sm h-5"></div>
            </div>

            <!-- Liste der aktuellen Bilder -->
            <h3 class="font-bold text-gray-700 mb-3">Aktuelle Bilder in der Slideshow:</h3>
            <div id="imagesGallery" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="text-gray-400 italic">Lade Bilder...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        // Nur noch Firestore, Firebase Storage wurde entfernt!
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ==========================================
        // 1. DEINE FIREBASE DATEN (Für Login & Links)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyA9ONDoCc-PahLWVkvECTZz1E9U8dpjgPc",
            authDomain: "flycardinal-a3635.firebaseapp.com",
            projectId: "flycardinal-a3635",
            storageBucket: "flycardinal-a3635.firebasestorage.app",
            messagingSenderId: "47686059980",
            appId: "1:47686059980:web:39711435422c3447ecbf69"
        };

        // ==========================================
        // 2. DEINE CLOUDINARY DATEN (Für Bild-Upload)
        // ==========================================
        const CLOUDINARY_CLOUD_NAME = "drpuhsspx"; 
        const CLOUDINARY_UPLOAD_PRESET = "lycl49dd";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- AUTHENTIFIZIERUNG ---
        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');
                loadImages(); 
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });

        document.getElementById('loginBtn').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(() => { document.getElementById('login-error').textContent = "Login fehlgeschlagen."; });
        });

        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, new GoogleAuthProvider()).catch(() => { document.getElementById('login-error').textContent = "Google Login Fehler."; });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        // --- CLOUDINARY BILDER UPLOAD ---
        let selectedFile = null;
        const imageUploadInput = document.getElementById('imageUpload');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadStatus = document.getElementById('uploadStatus');

        imageUploadInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('fileName').textContent = selectedFile.name;
                uploadBtn.disabled = false;
            }
        });

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            uploadBtn.disabled = true;
            uploadStatus.textContent = "Lädt zu Cloudinary hoch... Bitte warten.";
            uploadStatus.className = "mt-3 font-semibold text-sm h-5 text-blue-500 animate-pulse";

            try {
                // 1. Daten für Cloudinary vorbereiten
                const formData = new FormData();
                formData.append("file", selectedFile);
                formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

                // 2. Bild direkt zu Cloudinary senden
                const cloudinaryResponse = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!cloudinaryResponse.ok) {
                    throw new Error("Cloudinary Upload fehlgeschlagen. Preset auf 'unsigned' gestellt?");
                }

                const cloudinaryData = await cloudinaryResponse.json();
                
                // Cloudinary komprimiert automatisch und liefert eine sichere HTTPS URL
                const secureUrl = cloudinaryData.secure_url;
                const publicId = cloudinaryData.public_id;

                // 3. Den Cloudinary-Link in deiner Firebase-Datenbank speichern
                await addDoc(collection(db, "slideshow_images"), {
                    url: secureUrl,
                    cloudinaryId: publicId,
                    uploadedAt: new Date()
                });

                uploadStatus.textContent = "Erfolgreich hochgeladen!";
                uploadStatus.className = "mt-3 font-semibold text-sm h-5 text-green-500";
                
                selectedFile = null;
                imageUploadInput.value = "";
                document.getElementById('fileName').textContent = "Kein Bild ausgewählt";

            } catch (error) {
                console.error(error);
                uploadStatus.textContent = "Fehler beim Upload. Details in der Konsole.";
                uploadStatus.className = "mt-3 font-semibold text-sm h-5 text-red-500";
            } finally {
                setTimeout(() => { if(uploadStatus.textContent.includes("Erfolgreich")) uploadStatus.textContent = ""; }, 4000);
            }
        });

        // --- BILDER ANZEIGEN & LÖSCHEN ---
        function loadImages() {
            onSnapshot(collection(db, "slideshow_images"), (snapshot) => {
                const gallery = document.getElementById('imagesGallery');
                gallery.innerHTML = '';

                if(snapshot.empty) {
                    gallery.innerHTML = '<div class="text-gray-500 col-span-3">Noch keine Bilder hochgeladen.</div>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;

                    const div = document.createElement('div');
                    div.className = "relative group rounded-xl overflow-hidden border border-gray-200 shadow-sm aspect-video bg-gray-100";
                    div.innerHTML = `
                        <img src="${data.url}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black bg-opacity-50 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col items-center justify-center p-2 text-center">
                            <button class="delete-btn bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded shadow mb-2" data-id="${docId}">
                                Von Webseite entfernen
                            </button>
                            <span class="text-xs text-gray-300">Entfernt den Link. Die Datei bleibt in Cloudinary.</span>
                        </div>
                    `;
                    gallery.appendChild(div);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        if(confirm("Soll das Bild von der Startseite entfernt werden?")) {
                            try {
                                // Löscht den Link aus Firestore (verschwindet von der Seite)
                                await deleteDoc(doc(db, "slideshow_images", id));
                            } catch (err) {
                                console.error("Fehler beim Löschen:", err);
                                alert("Fehler beim Löschen des Links.");
                            }
                        }
                    });
                });
            });
        }
    </script>
</body>
</html>
